      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue bb-srv-base-AlertTopicArn]

  WeeklyPreScriptFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: bb-srv-dlm-weekly-prescript-failed
      AlarmDescription: With ExecuteOperationOnScriptFailure=false, a failed pre-script means no weekly snapshot for that instance.
      Namespace: AWS/EBS
      MetricName: PreScriptFailed
      Dimensions: [{Name: DLMPolicyId, Value: !GetAtt WeeklyPolicy.PolicyId}]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue bb-srv-base-AlertTopicArn]

  WeeklyPostScriptFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: bb-srv-dlm-weekly-postscript-failed
      AlarmDescription: The post-script did not start the instance again. The auto-thaw or bb-srv-sector-up should, check the sector.
      Namespace: AWS/EBS
      MetricName: PostScriptFailed
      Dimensions: [{Name: DLMPolicyId, Value: !GetAtt WeeklyPolicy.PolicyId}]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
