      AlarmActions: [!ImportValue bb-srv-base-AlertTopicArn]

  StoppedSnapshotsFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: bb-srv-dlm-stopped-snapshots-failed
      Namespace: AWS/EBS
      MetricName: SnapshotsCreateFailed
      Dimensions: [{Name: DLMPolicyId, Value: !GetAtt StoppedPolicy.PolicyId}]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue bb-srv-base-AlertTopicArn]

  SnapshotFailedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: bb-srv-ebs-snapshot-failed
      Description: An EBS snapshot of the account failed.
      EventPattern:
        source: [aws.ec2]
        detail-type: [EBS Snapshot Notification]
        detail:
          result: [failed]
      Targets:
        - Id: alerts
          Arn: !ImportValue bb-srv-base-AlertTopicArn

  DlmStateRule:
    Type: AWS::Events::Rule
    Properties:
      Name: bb-srv-dlm-policy-state
      Description: A DLM policy of the account changed state (for example to ERROR).
      EventPattern:
        source: [aws.dlm]
        detail-type: [DLM Policy State Change]
      Targets:
        - Id: alerts
          Arn: !ImportValue bb-srv-base-AlertTopicArn

  # A Run Command sent by targets (tags, resource groups) does not name the instances, so the rules
  # per VM (bb-srv-<sector>-command-other-doc, bb-srv-signal-command) do not see it, although it may
  # reach a Builders Bot host as root. Account-wide: it also alerts on other teams' targeted commands.
  # CloudTrail writes the field as targets[].key; Key covers the other spelling.
  CommandByTargetsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: bb-srv-command-by-targets
      Description: An SSM Run Command sent by targets in the account (it may reach a Builders Bot host without naming it).
      EventPattern:
        source: [aws.ssm]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [SendCommand]
          $or:
            - requestParameters:
                targets:
                  key: [{exists: true}]
            - requestParameters:
                targets:
                  Key: [{exists: true}]
      Targets:
        - Id: alerts
          Arn: !ImportValue bb-srv-base-AlertTopicArn

Outputs:
  InstallDocumentName:
    Value: !Ref InstallDocument
  UpgradeDocumentName:
    Value: !Ref UpgradeDocument
  SnapshotHooksDocumentName:
    Value: !Ref SnapshotHooksDocument
  ProxyReloadDocumentName:
    Value: !Ref ProxyReloadDocument
  DailyPolicyId:
    Value: !GetAtt DailyPolicy.PolicyId
  WeeklyPolicyId:
    Value: !GetAtt WeeklyPolicy.PolicyId
  StoppedPolicyId:
    Value: !GetAtt StoppedPolicy.PolicyId
